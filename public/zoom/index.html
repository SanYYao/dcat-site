<title>放大才看得见 · 死猫</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0A1120; overflow: hidden;
    font-family: -apple-system, "Noto Sans SC", "PingFang SC", sans-serif;
  }
  #wrap {
    position: fixed; inset: 0; display: grid; place-items: center;
    overflow: hidden; cursor: zoom-in;
    background: radial-gradient(120% 90% at 28% 60%, #121d31 0%, #0A1120 62%, #080e19 100%);
  }
  #wrap.zoomed { cursor: zoom-out; }
  #stage {
    width: min(100vw, 142.85vh);
    transform-origin: 63.2% 59.0%;
    transition: transform 980ms cubic-bezier(.16,.86,.20,1);
    will-change: transform;
  }
  #wrap.zoomed #stage { transform: scale(4.2); }
  #stage svg { display: block; width: 100%; height: auto; }

  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px;
    background: rgba(11, 19, 33, .93);
    border: 1px solid rgba(255, 236, 206, .16);
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 10px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
    color: #E8DCC6; font-size: 13.5px; letter-spacing: .04em;
    transition: opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
    user-select: none; pointer-events: none;
  }
  #hint b { color: #FFD9A0; font-weight: 600; }
  #hint.out { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.94); }

  #back {
    position: fixed; left: 18px; top: 18px;
    padding: 8px 15px; border-radius: 999px;
    background: rgba(13,22,38,.6); border: 1px solid rgba(255,236,206,.12);
    color: #B9C7DA; text-decoration: none; font-size: 12.5px;
    backdrop-filter: blur(8px); opacity: .8;
    transition: opacity .3s, transform .3s;
  }
  #back:hover { opacity: 1; transform: translateY(-1px); }
  @media (max-width: 640px) {
    #hint { bottom: 18px; font-size: 12.5px; padding: 9px 16px; }
    #back { display: none; }
  }
</style>
</head>

<div id="hint">点一下，<b>凑近鼻头</b> —— 那里有一枚只属于这只猫的纹理</div>
<script>
  const wrap = document.getElementById('wrap');
  const hint = document.getElementById('hint');
  const flip = () => {
    wrap.classList.toggle('zoomed');
    hint.classList.toggle('out');
    if (wrap.classList.contains('zoomed')) {
      hint.innerHTML = '再点一下退回 · 这就是「放大才看得见」';
      requestAnimationFrame(() => setTimeout(() => hint.classList.remove('out'), 60));
    } else {
      hint.innerHTML = '点一下，<b>凑近鼻头</b> —— 那里有一枚只属于这只猫的纹理';
    }
  };
  wrap.addEventListener('click', flip);
  wrap.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  setTimeout(() => { if (!wrap.classList.contains('zoomed')) hint.classList.add('out'); }, 9000);
  wrap.addEventListener('click', () => hint.classList.remove('out'));
</script>
